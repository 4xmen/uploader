<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex">
    <title>Admin — XMen Uploader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230071e3'/%3E%3Cpath d='M16 8v12m0 0 5-5m-5 5-5-5M10 24h12' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="stage">
        <header class="topbar">
            <a href="/" class="brand">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3 4 6.5v5c0 4.5 3.2 8.3 8 9.5 4.8-1.2 8-5 8-9.5v-5Z"/>
                        <path d="M9.5 12l2 2 3.5-3.5"/>
                    </svg>
                </span>
                <span class="brand-title">Admin Dashboard</span>
            </a>
            <a href="/" class="nav-link">Uploader</a>
        </header>

        <section class="card" id="loginCard">
            <div class="card-header">
                <h1 class="card-title">Authenticate</h1>
                <p class="card-subtitle">Enter admin secret key to view statistics.</p>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 14px;">
                <input type="password" id="secretInput" class="input" placeholder="Secret key" autocomplete="current-password" spellcheck="false" required>
                <div id="loginNoticeWrap"></div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Unlock dashboard</button>
            </form>
        </section>

        <section class="card" id="statsCard" hidden>
            <div class="card-header">
                <h1 class="card-title">System stats</h1>
                <p class="card-subtitle" id="statsUpdated">—</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-number" id="statFiles">0</span>
                    <span class="stat-label">Active files</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="statDownloads">0</span>
                    <span class="stat-label">Total downloads</span>
                </div>
                <div class="stat-box span-2">
                    <span class="stat-number" id="statStorage">0 Bytes</span>
                    <span class="stat-label">Storage in use</span>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn btn-primary" id="refreshBtn">Refresh stats</button>
                <button type="button" class="btn btn-secondary" id="logoutBtn">Sign out</button>
            </div>
        </section>
    </main>

    <div class="toasts" id="toasts"></div>

    <script src="/app.js"></script>
    <script>
    (() => {
        'use strict';

        const { fmtBytes, toast, ICON_WARN } = window.App;

        const loginCard = document.getElementById('loginCard');
        const statsCard = document.getElementById('statsCard');
        const loginForm = document.getElementById('loginForm');
        const secretInput = document.getElementById('secretInput');
        const loginNoticeWrap = document.getElementById('loginNoticeWrap');
        const loginBtn = document.getElementById('loginBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        const statFiles = document.getElementById('statFiles');
        const statDownloads = document.getElementById('statDownloads');
        const statStorage = document.getElementById('statStorage');
        const statsUpdated = document.getElementById('statsUpdated');

        const STORAGE_KEY = 'admin_secret';

        function showNotice(msg) {
            loginNoticeWrap.innerHTML = '';
            if (!msg) return;
            const el = document.createElement('div');
            el.className = 'notice';
            el.innerHTML = ICON_WARN + '<span></span>';
            el.querySelector('span').textContent = msg;
            loginNoticeWrap.appendChild(el);
        }

        function animateNumber(element, target, formatter) {
            const startVal = Number(element.dataset.val || 0);
            element.dataset.val = String(target);
            if (startVal === target) {
                element.textContent = formatter(target);
                return;
            }
            const startTime = performance.now();
            const duration = 400;
            function step(now) {
                const elapsed = Math.min((now - startTime) / duration, 1);
                const current = Math.round(startVal + (target - startVal) * elapsed);
                element.textContent = formatter(current);
                if (elapsed < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        async function fetchStats(key) {
            loginBtn.disabled = true;
            refreshBtn.disabled = true;
            showNotice('');

            try {
                const res = await fetch('/api/admin/stats', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${key}`
                    }
                });

                if (res.status === 401) {
                    localStorage.removeItem(STORAGE_KEY);
                    loginCard.hidden = false;
                    statsCard.hidden = true;
                    showNotice('Invalid admin secret.');
                    return;
                }
                if (res.status === 403) {
                    showNotice('Admin access is disabled on the server.');
                    return;
                }
                if (res.status === 429) {
                    showNotice('Too many attempts. Please wait a minute and retry.');
                    return;
                }
                if (!res.ok) {
                    throw new Error(`Server returned status ${res.status}`);
                }

                const data = await res.json();
                localStorage.setItem(STORAGE_KEY, key);

                animateNumber(statFiles, data.active_files || 0, n => String(n));
                animateNumber(statDownloads, data.total_downloads || 0, n => String(n));
                animateNumber(statStorage, data.total_size_bytes || 0, n => fmtBytes(n));

                statsUpdated.textContent = `Updated at ${new Date().toLocaleTimeString()}`;
                loginCard.hidden = true;
                statsCard.hidden = false;
            } catch (err) {
                showNotice('Failed to connect to server. Check connection.');
            } finally {
                loginBtn.disabled = false;
                refreshBtn.disabled = false;
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const key = secretInput.value.trim();
            if (!key) return showNotice('Please enter admin secret.');
            fetchStats(key);
        });

        refreshBtn.addEventListener('click', () => {
            const key = localStorage.getItem(STORAGE_KEY);
            if (key) fetchStats(key);
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            secretInput.value = '';
            statsCard.hidden = true;
            loginCard.hidden = false;
            toast('Signed out');
        });

        const existingKey = localStorage.getItem(STORAGE_KEY);
        if (existingKey) {
            secretInput.value = existingKey;
            fetchStats(existingKey);
        }
    })();
    </script>
</body>
</html>
